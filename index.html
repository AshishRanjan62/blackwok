const pic=i=>{const n=i.n,c=cats[i.c].n,k=/biryani/i.test(n)?'biryani':/roll|paratha/i.test(n)&&!/naan/i.test(n)?'roll':/thali/i.test(n)?'thali':/fried rice/i.test(n)?'friedrice':/noodles/i.test(n)?'noodles':/baby ?corn|crispy corn/i.test(n)?'babycorn':/pakoda/i.test(n)?'pakoda':/chicken/i.test(n)&&/lollypop|chilly|manchurian|65/i.test(n)?'nvchilly':{'Indian Veg':'veg','Indian Non Veg':'nvcurry','Kabab Veg':'tikka','Kabab Non Veg':'tandoori',Chinese:'wok',Starter:'wok',Combo:'thali'}[c];return IMG[k]||''};
const slug=i=>i.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const photo=i=>`<img class="ph" src="images/${slug(i)}.jpg" loading="lazy" alt="${i.n}" onerror="imgFail(this,${i.id})">`;
function imgFail(el,id){const it=items[id],u=pic(it);if(u&&!el.dataset.f){el.dataset.f=1;el.src=u}else el.outerHTML=`<div class="ph">${cats[it.c].ic}</div>`}
const circ=i=>`<img src="images/category-${slug({n:cats[i.c].n})}.jpg" alt="" onerror="catFail(this,${i.c})">`;
function catFail(el,c){const it=items.find(x=>x.c==c),u=pic(it);if(u&&!el.dataset.f){el.dataset.f=1;el.src=u}else el.replaceWith(Object.assign(document.createElement('span'),{textContent:cats[c].ic}))}
const fil=i=>S.f=='all'||(S.f=='veg')==!!i.v;
const seg=()=>`<div class="seg">${[['all','All'],['veg','🟢 Veg'],['nv','🔴 Non-Veg']].map(x=>`<button class="${S.f==x[0]?'on':''}" onclick="S.f='${x[0]}';r()">${x[1]}</button>`).join('')}</div>`;
const sb=(id,s,l,p)=>{const q=(S.cart[id+s]||{}).q||0;return`<div class="szb"><div><small>${l}</small><b>${inr(p)}</b></div>${q?`<div class="stp2"><button onclick="chg('${id}${s}',-1)">−</button>${q}<button onclick="chg('${id}${s}',1)">+</button></div>`:`<button class="sadd" onclick="addC(${id},'${s}',1);r()">ADD</button>`}</div>`};
const card=i=>{const id=i.id,q=(S.cart[id+'f']||{}).q||0;const nm=`<div class="n"><div>${dot(i.v)}<b>${i.n}</b><br>${i.h?'':`<span class="pr">${inr(i.f)}</span><br>`}<small>${cats[i.c].n}${i.h?' · Half / Full':''}</small></div></div>`;
if(i.h)return`<div class="ic s" style="flex-wrap:wrap">${nm}<div class="pw">${photo(i)}</div><div class="szr">${sb(id,'h','Half',i.h)}${sb(id,'f','Full',i.f)}</div></div>`;
const btn=q?`<div class="stp"><button onclick="chg('${id}f',-1)">−</button>${q}<button onclick="chg('${id}f',1)">+</button></div>`:`<button class="add" onclick="addC(${id},'f',1);r()">ADD</button>`;
return`<div class="ic">${nm}<div class="pw">${photo(i)}${btn}</div></div>`};
const rows=()=>{const q=S.q.toLowerCase().trim();const L=items.filter(i=>fil(i)&&(S.cat===null||i.c==S.cat)&&q.split(/\s+/).every(w=>i.n.toLowerCase().includes(w)));if(!L.length)return'<p class="p">No dishes found.</p>';if(S.cat!==null)return L.map(card).join('');return cats.map((c,k)=>{const m=L.filter(i=>i.c==k);return m.length?`<h3 class="sec">${c.ic} ${c.n}<small>${m.length} items</small></h3>`+m.map(card).join(''):''}).join('')};
const hb=()=>S.q.trim()?`<h3 class="sec">Results for “${S.q.trim()}”</h3>${rows()}`:`<h3 class="sec">What's on your mind?</h3><div class="grid">${catBtns((c,k)=>`<button class="tile" onclick="S.q='';go('list',${k})"><div class="cr">${circ(items.find(x=>x.c==k))}</div>${c.n}</button>`)}</div><h3 class="sec">🔥 Popular Items<small onclick="S.cat=null;go('list')" style="color:#e23744;cursor:pointer">View all ›</small></h3>${['Kadhai Paneer','Shahi Paneer','Paneer Butter Masala','Chicken Biryani','Chicken Roll','Paneer Roll','Chicken Lollypop','Chicken Tandoori','Paneer Tikka','Veg Noodles','Veg Fried Rice','Butter Naan'].map(n=>items.find(x=>x.n==n)).filter(fil).map(card).join('')}`;
const catBtns=f=>cats.map((c,k)=>items.some(i=>i.c==k&&fil(i))?f(c,k):'').join('');
const SC={
land:()=>`<div style="min-height:100vh;display:flex;flex-direction:column;background:#fff"><div style="background:linear-gradient(160deg,#1c1c1c,#5a1218);color:#fff;padding:48px 24px 84px;text-align:center;border-radius:0 0 34px 34px"><div style="font-size:12px;letter-spacing:4px;color:#ffb3ba">WELCOME TO</div><div class="big" style="font-size:40px;margin:8px 0;color:#fff;letter-spacing:0">The BlackWok</div><div style="color:#e5e5e5;font-size:15px">Good Food Brings People Together</div><div style="display:flex;justify-content:center;margin:28px 0 22px">${['biryani','tikka','roll'].map((k,j)=>`<img src="${IMG[k]}" alt="" style="width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin-left:${j?-18:0}px;box-shadow:0 6px 16px #0006">`).join('')}</div><span style="background:#fff;color:#e23744;padding:9px 26px;border-radius:30px;font-weight:700;font-size:18px">📍 Table ${S.table}</span></div><div class="card" style="margin:-44px 16px 0;display:flex;justify-content:space-around;text-align:center;font-size:12px;color:#444;padding:18px 6px"><div><div style="font-size:26px">🍴</div>Delicious<br>Food</div><div><div style="font-size:26px">⚡</div>Quick<br>Ordering</div><div><div style="font-size:26px">📱</div>Safe &amp;<br>Contactless</div></div><div style="flex:1"></div><div style="padding:20px 16px 28px"><button class="gold" style="padding:16px;font-size:17px" onclick="go('home')">View Menu &amp; Order →</button><p style="text-align:center;color:#888;font-size:12px;margin:14px 0 0">Scan · Order · Pay — right from your table</p></div></div>`,
home:()=>`${hdr('The BlackWok')}<div class="hero2"><div><small>DINE-IN · TABLE ${S.table}</small><h2>Hungry? Order in a few taps</h2><p>Fresh, hot &amp; served at your table</p></div><img src="${IMG.biryani}" alt=""></div><div style="padding:2px 12px 12px"><input class="srch" placeholder="🔍 Search for dishes..." value="${S.q}" autocomplete="off" oninput="S.q=this.value;S.cat=null;$('#hbody').innerHTML=hb()" onkeydown="if(event.key=='Enter')this.blur()"></div>${seg()}<div id="hbody">${hb()}</div>${nav('home')}`,
menu:()=>SC.home(),
list:()=>`${hdr('Menu',"go('home')")}<div style="padding-top:10px">${seg()}</div><div class="chips"><button class="chip ${S.cat===null?'on':''}" onclick="go('list',null)">All</button>${catBtns((c,k)=>`<button class="chip ${S.cat===k?'on':''}" onclick="go('list',${k})">${c.ic} ${c.n}</button>`)}</div><div class="p" style="padding-top:2px"><input class="srch" placeholder="🔍 Search dishes..." value="${S.q}" oninput="S.q=this.value;$('#res').innerHTML=rows()"></div><div id="res">${rows()}</div>${nav('home')}`,
detail:()=>{const i=items[S.it],p=pr(i,S.sz);return`${hdr(i.n,"go('list',"+i.c+")")}${pic(i)?`<img class="hero" src="${pic(i)}" alt="">`:`<div style="font-size:90px;text-align:center;padding:20px;background:#f4f4f6">${cats[i.c].ic}</div>`}<div class="card"><h2 style="margin:0">${i.n} ${dot(i.v)}</h2><small>${cats[i.c].n}</small>${i.h?`<p><b>Select Size</b></p><div class="sz"><button class="${S.sz=='h'?'on':''}" onclick="S.sz='h';r()">Half<br>${inr(i.h)}</button><button class="${S.sz=='f'?'on':''}" onclick="S.sz='f';r()">Full<br>${inr(i.f)}</button></div>`:`<p><b>${inr(i.f)}</b></p>`}<p><b>Quantity</b></p><div class="qty"><button onclick="S.qt=Math.max(1,S.qt-1);r()">−</button>${S.qt}<button onclick="S.qt++;r()">+</button></div><br><br><button class="gold" onclick="addC(${i.id},'${S.sz}',S.qt);go('cart')">🛒 Add to Cart | ${inr(p*S.qt)}</button></div>`},
cart:()=>{const ks=Object.keys(S.cart),hd=hdr('Your Cart',"go('home')");if(!ks.length)return`${hd}<div style="text-align:center;padding:90px 24px"><div style="font-size:64px">🛒</div><h3 style="margin:12px 0 4px">Your cart is empty</h3><p style="color:#777;margin:0 0 20px">Add some delicious dishes from the menu</p><button class="gold" onclick="go('home')">Browse Menu</button></div>${nav('cart')}`;const t=calc(cartSub());
return`${hd}<div style="padding:16px 16px 0"><b style="font-size:18px;font-family:Inter,system-ui,sans-serif">Order Summary</b> <small style="color:#777">· ${cnt()} item${cnt()>1?'s':''}</small></div><div class="card" style="padding:2px 14px">${ks.map(k=>{const c=S.cart[k],i=items[c.i];return`<div class="ci">${photo(i).replace('class="ph"','class="ph" style="width:68px;height:68px;font-size:26px"')}<div style="flex:1;min-width:0">${dot(i.v)}<b style="font-size:15px">${i.n}</b>${i.h?`<div class="sw"><button class="${c.s=='h'?'on':''}" onclick="setSz('${k}','h')">Half ${inr(i.h)}</button><button class="${c.s=='f'?'on':''}" onclick="setSz('${k}','f')">Full ${inr(i.f)}</button></div>`:''}<div style="margin-top:6px;font-weight:600">${inr(pr(i,c.s)*c.q)}</div></div><div class="stp2" style="align-self:center"><button onclick="chg('${k}',-1)">−</button>${c.q}<button onclick="chg('${k}',1)">+</button></div></div>`}).join('')}</div><div style="padding:0 16px"><a onclick="go('home')" style="color:#e23744;font-weight:600;font-size:14px;cursor:pointer">+ Add more items</a></div><div class="card"><b>Cooking instructions</b><input class="t" style="margin-top:8px" placeholder="E.g. less spicy, no onion..." value="${S.note||''}" oninput="S.note=this.value"></div><div class="card"><b>Bill Details</b><div style="margin-top:8px"><div class="tot"><span>Item total</span><span>${inr(t.sub)}</span></div><div class="tot"><span>CGST (2.5%)</span><span>${inr(t.c)}</span></div><div class="tot"><span>SGST (2.5%)</span><span>${inr(t.s)}</span></div><div class="tot"><span>Service charge (5%)</span><span>${inr(t.sv)}</span></div><hr style="border:0;border-top:1px dashed #ddd"><div class="tot"><b>To pay</b><b style="font-size:18px">${inr(t.t)}</b></div></div></div><p style="font-size:12px;color:#888;padding:0 16px">Self-ordering: your order is prepared after payment / confirmation.</p><div class="cb2"><div><small style="color:#777">TOTAL</small><br><b style="font-size:20px">${inr(t.t)}</b></div><button class="gold" style="width:auto;padding:13px 26px" onclick="go('pay')">Proceed to Pay →</button></div>${nav('cart')}`},
pay:()=>`${hdr('Payment',"go('cart')")}<div class="card"><small style="color:#777">Amount to pay</small><div style="font-size:32px;font-weight:700;font-family:Inter,system-ui,sans-serif">${inr(calc(cartSub()).t)}</div><small style="color:#777">${cnt()} item${cnt()>1?'s':''} · Table ${S.table}</small></div><div class="card"><b>Choose payment method</b><div class="opt ${S.pm=='online'?'on':''}" onclick="S.pm='online';r()"><span class="rad"></span><div style="flex:1"><b>Pay Online</b> <em class="rec">Recommended</em><br><small style="color:#777">UPI · Credit/Debit Card · Net Banking</small></div>💳</div><div class="opt ${S.pm=='counter'?'on':''}" onclick="S.pm='counter';r()"><span class="rad"></span><div style="flex:1"><b>Pay at Counter</b><br><small style="color:#777">Place order now, pay later at the restaurant</small></div>🏪</div><small style="color:#888">🔒 Your payment is safe and secure</small></div><div class="cb2" style="bottom:0"><button class="gold" onclick="S.pm=='online'?sheet(calc(cartSub()).t,placeOrder):placeOrder(0)">Continue →</button></div>`,
done:()=>{const o=S.orders[S.orders.length-1];return`<div style="text-align:center;padding:56px 20px 8px"><div style="width:88px;height:88px;border-radius:50%;background:#e7f6ef;color:#1ba672;font-size:46px;line-height:88px;margin:auto">✓</div><h1 style="margin:18px 0 4px">Order Placed!</h1><p style="color:#777;margin:0">Your order has been received and is being prepared.</p></div><div class="card"><div class="tot"><span style="color:#777">Order ID</span><b>#${o.no}</b></div><div class="tot"><span style="color:#777">Table</span><b>${S.table}</b></div><div class="tot"><span style="color:#777">Payment</span><b style="color:${o.paid?'#1ba672':'#e23744'}">${o.paid?'Paid':'Pay at counter'}</b></div><div class="tot"><span style="color:#777">Amount</span><b>${inr(o.tot)}</b></div><hr style="border:0;border-top:1px solid #eee"><div style="text-align:center;padding:6px 0"><small style="color:#777">Estimated preparation time</small><br><b style="font-size:24px;color:#e23744">15 - 20 Minutes</b></div></div><div style="display:flex;gap:10px;padding:0 12px"><button class="gold" style="background:#fff;color:#e23744;border:1px solid #e23744" onclick="go('orders')">Order Details</button><button class="gold" onclick="go('review')">View Bill</button></div>`},
orders:()=>`${hdr('My Orders',"go('home')")}${S.orders.length?S.orders.map(o=>{const rd=Date.now()-o.t>45000;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>#${o.no}</b><span class="st ${rd?'ok':'wip'}">${rd?'Ready to serve':'Preparing'}</span></div><hr style="border:0;border-top:1px solid #f0f0f0">${o.l.map(c=>`<div class="tot"><span>${c.q} × ${c.n}${c.sz?' ('+c.sz+')':''}</span><span>${inr(c.p*c.q)}</span></div>`).join('')}${o.note?`<small style="color:#777">📝 ${o.note}</small>`:''}<hr style="border:0;border-top:1px solid #f0f0f0"><div class="tot" style="align-items:center"><b>Total ${inr(o.tot)}</b><span class="st ${o.paid?'pd':'up'}">${o.paid?'Paid':'Pay at counter'}</span></div></div>`}).join('')+`<div class="p"><button class="gold" onclick="go('review')">Review &amp; Bill</button></div>`:`<div style="text-align:center;padding:90px 20px"><div style="font-size:56px">🧾</div><h3>No orders yet</h3><p style="color:#777">Your placed orders will appear here</p></div>`}${nav('orders')}`,
review:()=>{const due=S.orders.filter(o=>!o.paid).reduce((a,o)=>a+o.tot,0),tot=S.orders.reduce((a,o)=>a+o.tot,0);return`${hdr('Review &amp; Bill',"go('orders')")}<div class="card" style="text-align:center"><small style="color:#777">Total bill</small><div style="font-size:32px;font-weight:700;font-family:Inter,system-ui,sans-serif">${inr(tot)}</div><span class="st ${due?'up':'pd'}">${due?'Pending '+inr(due):'Paid ✔'}</span></div><div class="card" style="text-align:center"><b>How was your experience at The BlackWok?</b><div style="margin:6px 0">${[1,2,3,4,5].map(n=>`<button class="star ${S.star>=n?'on':''}" onclick="S.star=${n};r()">★</button>`).join('')}</div><textarea class="t" rows="3" placeholder="Tell us about your experience (optional)..." oninput="S.rv=this.value">${S.rv}</textarea></div><div class="card" style="display:flex;gap:10px"><button class="gold" style="background:#fff;color:#e23744;border:1px solid #e23744;box-shadow:none" onclick="go('bill')">⬇ Download Bill</button>${due?`<button class="gold" onclick="sheet(${due},payDue)">Pay Now | ${inr(due)}</button>`:''}</div><div style="padding:0 12px 20px"><button class="gold" style="background:#1c1c1c;box-shadow:none" onclick="go('thanks')">Submit &amp; Finish</button></div>`},
bill:()=>{const L={};S.orders.forEach(o=>o.l.forEach(c=>{const k=c.n+c.sz;L[k]?L[k].q+=c.q:L[k]={...c}}));const sub=Object.values(L).reduce((a,c)=>a+c.p*c.q,0),t=calc(sub),paid=S.orders.every(o=>o.paid);
return`<div class="p noprint"><button class="gold" onclick="print()">🖨 Save / Print PDF</button><br><br><button class="gold" style="background:#fff;color:#e23744;border:1px solid #e23744;box-shadow:none" onclick="go('review')">← Back</button></div><div id="billbox" class="card inv" style="color:#000"><div style="text-align:center"><div class="big" style="font-size:26px;letter-spacing:0">The BlackWok</div><small style="color:#666">Tax Invoice · Table ${S.table}<br>${new Date().toLocaleString()}</small></div><hr>${Object.values(L).map(c=>`<div class="tot"><span>${c.q} × ${c.n}${c.sz?' ('+c.sz+')':''}</span><span>${inr(c.p*c.q)}</span></div>`).join('')}<hr><div class="tot"><span>Subtotal</span><span>${inr(t.sub)}</span></div><div class="tot"><span>CGST 2.5%</span><span>${inr(t.c)}</span></div><div class="tot"><span>SGST 2.5%</span><span>${inr(t.s)}</span></div><div class="tot"><span>Service Charge 5%</span><span>${inr(t.sv)}</span></div><hr><div class="tot"><b>Grand Total</b><b style="font-size:20px">${inr(t.t)}</b></div><p style="text-align:center;margin:14px 0 0"><span class="st ${paid?'pd':'up'}">${paid?'PAID':'PAYMENT PENDING'}</span><br><br><small>Thank you for visiting!</small></p></div>`},
thanks:()=>`<div style="text-align:center;padding:90px 24px"><div style="width:88px;height:88px;border-radius:50%;background:#fdecee;font-size:44px;line-height:88px;margin:auto">🙏</div><p style="color:#777;margin:24px 0 4px;letter-spacing:2px;font-size:13px">THANK YOU FOR VISITING</p><div class="big" style="font-size:38px;color:#1c1c1c;letter-spacing:0">The BlackWok</div><p style="font-size:18px;color:#e23744;margin:6px 0 0">Visit Again!</p>${S.star?`<p style="color:#f5a623;font-size:24px;margin:18px 0 0">${'★'.repeat(S.star)}</p><small style="color:#777">Thanks for your rating!</small>`:''}<br><br><button class="gold" onclick="S.cart={};S.orders=[];S.rv='';go('land')">Start New Order</button></div>`,
more:()=>`${hdr('More',"go('home')")}<div class="card"><b>Table QR Codes</b><p style="color:#777;font-size:13px;margin:4px 0 12px">For restaurant staff. Generate a QR for each table, print it and place it on the table. Each QR opens this menu with its table number.</p><label style="font-size:13px;color:#555">Number of tables</label><input class="t" id="nt" type="number" min="1" max="60" value="${S.nt||10}" style="margin:6px 0 14px"><button class="gold" onclick="S.nt=+$('#nt').value;go('qr')">Generate QR Codes</button></div><div class="card"><b>Customer view</b><p style="color:#777;font-size:13px;margin:4px 0 12px">See the welcome screen customers get after scanning.</p><button class="gold" style="background:#fff;color:#e23744;border:1px solid #e23744;box-shadow:none" onclick="go('land')">Open welcome screen</button></div>${nav('more')}`,
qr:()=>`<div class="p noprint"><button class="gold" onclick="print()">🖨 Print QR Codes</button><br><br><button class="gold" style="background:#6b1217;color:#fff" onclick="go('more')">← Back</button></div><div id="billbox" class="p qrs">${Array.from({length:S.nt||10},(_,i)=>`<div><span id="q${i+1}"></span>Table ${i+1}</div>`).join('')}</div>`};
function r(){$('#app').innerHTML=SC[S.scr]();if(S.scr=='qr'&&window.QRCode){const b=location.href.split('?')[0].split('#')[0];for(let i=1;i<=(S.nt||10);i++)new QRCode($('#q'+i),{text:b+'?table='+i,width:150,height:150})}}
async function sheet(amt,cb){const ref='BW'+Date.now(),e=document.createElement('div');e.className='sheet';e.innerHTML='<div style="text-align:center;padding:28px"><b>Opening secure payment…</b><br><small style="color:#777">Please do not close this page</small></div>';document.body.appendChild(e);
try{localStorage.setItem('pend',JSON.stringify({ref,type:cb===payDue?'due':'new',cart:S.cart,orders:S.orders,table:S.table,note:S.note||'',amt}));
const res=await fetch('/api/create-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amt,ref,table:S.table})});const d=await res.json();if(!d.url)throw 0;location.href=d.url}
catch(x){e.remove();toast('Payment could not start. Try again or pay at counter.')}}
function placeOrder(paid){const l=Object.values(S.cart).map(c=>{const i=items[c.i];return{n:i.n,sz:i.h?(c.s=='h'?'Half':'Full'):'',p:pr(i,c.s),q:c.q}});S.orders.push({no:'ORD'+new Date().getFullYear().toString().slice(2)+String(Math.floor(Math.random()*90000+10000)),l,tot:calc(cartSub()).t,note:S.note||'',paid:!!paid,t:Date.now()});S.cart={};S.note='';go('done')}
function payDue(){S.orders.forEach(o=>o.paid=true);toast('Payment successful');r()}
(function(){const q=new URLSearchParams(location.search),st=q.get('pay');if(!st)return;try{const d=JSON.parse(localStorage.getItem('pend')||'null');if(d&&d.ref==q.get('ref')){S.cart=d.cart;S.orders=d.orders;S.table=d.table;S.note=d.note;localStorage.removeItem('pend');history.replaceState(null,'',location.pathname+'?table='+d.table);if(st=='ok'){if(d.type=='due'){payDue();S.scr='review'}else placeOrder(1)}else{S.scr=d.type=='due'?'review':'cart';setTimeout(()=>toast('Payment was not completed'),300)}}}catch(e){}})();
r();
</script></body></html>
